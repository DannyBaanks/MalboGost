name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install deps
        run: pip install pytest
      - name: Build gost
        run: gcc -O2 -Wall -Wextra -std=c11 -o gost gost.c && cp gost gost.exe && ./gost --help || true
      - name: Cross-backend tests
        run: python -m pytest test_gost.py::TestGostSpecific test_gost.py::TestXlatConsistency -v
      - name: E2E pipeline
        run: python e2e.py
      - name: Milestones M0-M3
        run: |
          python run_milestone.py milestones/M0_RUNTIME_INPUT --inputs A B C
